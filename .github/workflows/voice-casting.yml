name: Voice casting
on: workflow_dispatch
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: v1-baritone, instruct: "Глубокий бархатный мужской баритон 55 лет, тёплый и доверительный, неторопливый рассказчик документального фильма о тайнах истории, чистое московское произношение"}
          - {name: v2-narrator, instruct: "Мужской голос 45 лет, ясный и выразительный, как у ведущего научно-популярной передачи на телевидении, живые интонации, лёгкая загадочность, чистое русское произношение"}
          - {name: v3-calm-low, instruct: "Низкий спокойный мужской голос 60 лет, медленный темп, мягкие паузы, как у диктора аудиокниги, чистое русское литературное произношение"}
          - {name: v4-storyteller, instruct: "Мужской голос 40 лет, тёплый, с лёгкой улыбкой в голосе, рассказывает увлекательную историю другу, естественные интонации, чистое русское произношение"}
          - {name: v5-female-docu, instruct: "Спокойный низкий женский голос 45 лет, бархатный, уверенный, ведущая документального фильма, чистое русское литературное произношение"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -U qwen-tts soundfile
      - env: {INSTRUCT: "${{ matrix.instruct }}", CHUNKS_LIMIT: "3"}
        run: python bench/run_tts.py qwen-clone ${{ matrix.name }}
      - run: |
          mkdir -p casting && ffmpeg -loglevel error -y -i out/${{ matrix.name }}.wav -b:a 128k casting/${{ matrix.name }}.mp3
      - uses: actions/upload-artifact@v4
        with: {name: "${{ matrix.name }}", path: casting/}
  save:
    needs: voice
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: casting, merge-multiple: true}
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add casting && git commit -m "Voice casting samples" && git push

name: Narration timeline (scene lengths + word times, for writing the storyboard)
on:
  workflow_dispatch:
    inputs:
      episode: {description: "Episode folder", default: "episodes/002-lake-natron"}
permissions:
  contents: write
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      EP: ${{ inputs.episode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          bash scripts/install_ffmpeg.sh
          pip install --quiet numpy soundfile azure-cognitiveservices-speech
      - name: Narration (Azure, Dmitry) - stops on unmarked homographs
        run: python scripts/narrate_azure.py "$EP" | tee narrate.log
      - name: Commit timeline (no audio)
        run: |
          d="$EP/build"; mkdir -p $d
          cp out/timeline.json $d/timeline.json; cp out/ssml_log.txt $d/ssml_log.txt
          ffmpeg -loglevel error -y -i out/narration.wav -c:a libmp3lame -b:a 96k $d/narration-preview.mp3
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git pull -q; git add $d && git commit -m "Narration timeline for $EP" && git push

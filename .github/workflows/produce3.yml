name: Produce episode v3 (storyboard v2 + templates + QA)
on:
  workflow_dispatch:
    inputs:
      episode: {description: "Episode folder", default: "episodes/001-sandy-island"}
      autopick: {description: "Auto-pick the best candidate per shot (pilot only): yes/no", default: "no"}
      upload: {description: "Upload to YouTube as UNLISTED: yes/no", default: "no"}
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      EP: ${{ inputs.episode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet matplotlib pillow numpy soundfile azure-cognitiveservices-speech cartopy shapely
      - name: Validate storyboard
        run: python scripts/sb2.py check "$EP/storyboard.json"
      - name: Stock candidates (open water only, 16:9, no black bars, blocklist)
        run: python scripts/stock2.py candidates "$EP/storyboard.json" cands | tee candidates.log | tail -30
      - name: Auto-pick (pilot only) or use the picks from the storyboard
        run: |
          if [ "${{ inputs.autopick }}" = "yes" ]; then python scripts/stock2.py autopick "$EP/storyboard.json" cands/candidates.json picked.json
          else cp "$EP/storyboard.json" picked.json; fi
      - name: Narration (Azure, Dmitry)
        run: python scripts/narrate_azure.py "$EP"
      - run: python scripts/sb2.py check picked.json out/timeline.json --picks
      - run: python scripts/sb2.py resolve picked.json out/timeline.json shots.json
      - run: python scripts/assets.py "$EP" picked.json assets
      - run: python scripts/stock2.py fetch picked.json stock
      - run: python scripts/render3.py shots.json stock assets out/narration.wav out/timeline.json video.mp4
      - name: QA (no clip twice; frame sheets every 2 s)
        run: python scripts/qa_video.py video.mp4 shots.json stock qa --timeline out/timeline.json
      - run: python scripts/fill_meta.py "$EP/meta.json" out/timeline.json meta.final.json assets/assets.json
      - name: Upload to YouTube (unlisted)
        if: inputs.upload == 'yes'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/yt_upload.py video.mp4 meta.final.json "$EP/thumbnail.jpg" | tee upload.log
      - uses: actions/upload-artifact@v4
        with: {name: video, path: video.mp4}
      - name: Save build info (sheets, QA report, picks, sources)
        if: always()
        run: |
          d="$EP/build"; mkdir -p $d/qa $d/candidates
          cp qa/* $d/qa/ 2>/dev/null || true
          cp cands/* $d/candidates/ 2>/dev/null || true
          cp out/timeline.json out/ssml_log.txt stock/stock.json meta.final.json shots.json picked.json candidates.log $d/ 2>/dev/null || true
          [ -f upload.log ] && grep VIDEO_URL upload.log | cut -d' ' -f2 > $d/youtube_url.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git pull -q; git add $d && git commit -m "Build $EP (v3)" && git push

name: Produce episode (render + upload unlisted)
on:
  workflow_dispatch:
    inputs:
      episode: {description: "Episode folder", default: "episodes/001-sandy-island"}
      narration_run_id: {description: "Run id of 'Narrate episode' with the narration artifact", required: true}
      visuals: {description: "Visuals script", default: "scripts/visuals_sandy.py"}
      upload: {description: "Upload to YouTube (unlisted)", default: "yes"}
permissions:
  contents: write
  actions: read
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/download-artifact@v4
        with: {name: narration, path: out, run-id: "${{ inputs.narration_run_id }}", github-token: "${{ github.token }}"}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet matplotlib cartopy pillow numpy
      - run: python ${{ inputs.visuals }} frames
      - run: python scripts/render.py frames out/narration.wav ${{ inputs.episode }}/build/timeline.json video.mp4
      - run: python scripts/fill_meta.py ${{ inputs.episode }}/meta.json ${{ inputs.episode }}/build/timeline.json meta.final.json
      - run: ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of compact video.mp4
      - uses: actions/upload-artifact@v4
        with: {name: video, path: video.mp4}
      - name: Upload to YouTube (unlisted)
        if: inputs.upload == 'yes'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/yt_upload.py video.mp4 meta.final.json ${{ inputs.episode }}/thumbnail.jpg | tee upload.log
      - name: Save result
        if: inputs.upload == 'yes'
        run: |
          grep VIDEO_URL upload.log | cut -d' ' -f2 > ${{ inputs.episode }}/build/youtube_url.txt
          cp meta.final.json ${{ inputs.episode }}/build/
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git pull -q; git add ${{ inputs.episode }}/build && git commit -m "Uploaded ${{ inputs.episode }} (unlisted)" && git push

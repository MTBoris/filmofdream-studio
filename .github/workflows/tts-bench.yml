name: TTS benchmark
on:
  workflow_dispatch:
    inputs:
      engines:
        description: "Comma list of matrix names to run, or 'all' or 'none'"
        default: all
      qa_run_id:
        description: "Also QA artifacts from this earlier run id (optional)"
        default: ""
      qa_run_id2:
        description: "And from this run id (optional)"
        default: ""
permissions:
  contents: write
  actions: read
jobs:
  tts:
    if: inputs.engines != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: qwen-design, name: qwen-design-male, instruct: "Спокойный мужской голос 50 лет, низкий тембр, неторопливый рассказчик документального фильма, чистое русское произношение без акцента"}
          - {engine: qwen-design, name: qwen-design-female, instruct: "Тёплый женский голос 40 лет, спокойная уверенная интонация ведущей документального фильма, чистое русское произношение без акцента"}
          - {engine: qwen-custom, name: qwen-custom-ryan, instruct: ""}
          - {engine: chatterbox, name: chatterbox-default, instruct: ""}
    steps:
      - name: Skip check
        id: skip
        run: |
          if [ "${{ inputs.engines }}" = all ] || echo ",${{ inputs.engines }}," | grep -q ",${{ matrix.name }},"; then echo run=1 >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.skip.outputs.run
      - uses: actions/setup-python@v5
        if: steps.skip.outputs.run
        with: {python-version: "3.11"}
      - name: Install
        if: steps.skip.outputs.run
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
          if [[ "${{ matrix.engine }}" == qwen* ]]; then
            pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
            pip install --quiet -U qwen-tts soundfile
          else
            pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            pip install --quiet chatterbox-tts soundfile
          fi
      - name: Generate
        if: steps.skip.outputs.run
        env: {INSTRUCT: "${{ matrix.instruct }}"}
        run: python bench/run_tts.py ${{ matrix.engine }} ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.skip.outputs.run
        with: {name: "${{ matrix.name }}", path: out/, if-no-files-found: ignore}
  qa:
    needs: tts
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: inputs.engines != 'none'
        with: {path: out, merge-multiple: true}
      - uses: actions/download-artifact@v4
        if: inputs.qa_run_id != ''
        with: {path: out, merge-multiple: true, run-id: "${{ inputs.qa_run_id }}", github-token: "${{ github.token }}"}
      - uses: actions/download-artifact@v4
        if: inputs.qa_run_id2 != ''
        with: {path: out, merge-multiple: true, run-id: "${{ inputs.qa_run_id2 }}", github-token: "${{ github.token }}"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install --quiet faster-whisper
      - run: python bench/qa.py
      - name: Save results
        run: |
          mkdir -p bench/results
          for f in out/*.wav; do ffmpeg -loglevel error -y -i "$f" -b:a 128k "bench/results/$(basename "${f%.wav}").mp3"; done
          cp out/*.json bench/results/
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git pull -q; git add bench/results && git commit -m "TTS benchmark results" && git push
